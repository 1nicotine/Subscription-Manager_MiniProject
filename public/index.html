<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230f6e5c'/%3E%3Cpath d='M24 11a13 13 0 1 1-12.4 9M8 14l4.2 6.3 6-3.6' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ctext x='24' y='30' text-anchor='middle' font-size='16' font-weight='700' fill='%23fff' font-family='Arial,sans-serif'%3E%E0%B8%BF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="topnav" aria-label="เมนูหลัก">
    <a href="#overview">สรุป</a>
    <a href="#list-section">รายการ</a>
    <a href="#sub-form">เพิ่มบริการ</a>
  </nav>

  <section class="hero">
    <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="โลโก้ Subscription Manager">
        <rect width="48" height="48" rx="12" fill="var(--accent)"/>
        <path d="M24 11a13 13 0 1 1-12.4 9M8 14l4.2 6.3 6-3.6" fill="none" stroke="var(--on-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="var(--on-accent)" font-family="Arial, sans-serif">฿</text>
      </svg>
    <h1><span class="w" style="--w:0">Subscription</span> <span class="w" style="--w:1">Manager</span></h1>
    <p class="sub">จัดการบริการรายเดือนและรายปีของคุณ ดูว่าเดือนนี้จ่ายอะไรไปเท่าไร</p>
    <button type="button" id="cta" class="cta">เพิ่มบริการ
      <span class="cta-dot" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
    </button>
  </section>

  <header id="overview">
    <div id="summary" aria-live="polite"></div>
    <div id="breakdown"></div>
  </header>

  <main>
    <form id="sub-form">
      <h2 id="form-title">เพิ่มบริการ</h2>
      <label>ชื่อบริการ
        <input id="name" required placeholder="เช่น Netflix">
      </label>
      <div class="row">
        <label>ราคา (บาท)
          <input id="price" type="number" min="0" step="any" required>
        </label>
        <label>รอบชำระ
          <select id="billing">
            <option value="monthly">รายเดือน</option>
            <option value="yearly">รายปี</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>หมวด
          <select id="category">
            <option value="entertainment">บันเทิง</option>
            <option value="music">เพลง</option>
            <option value="cloud">คลาวด์</option>
            <option value="education">การเรียน</option>
            <option value="other">อื่น ๆ</option>
          </select>
        </label>
        <label>ชำระครั้งถัดไป
          <input id="nextPayment" type="date">
        </label>
      </div>
      <p id="error" role="alert"></p>
      <div class="row">
        <button type="submit" id="submit-btn">เพิ่มบริการ</button>
        <button type="button" id="cancel-btn" class="ghost" hidden>ยกเลิก</button>
      </div>
    </form>

    <section id="list-section">
      <div id="toolbar">
        <label>ค้นหา
          <input id="q" type="search" placeholder="พิมพ์ชื่อบริการ">
        </label>
        <label>เรียงตาม
          <select id="sort">
            <option value="">ค่าเริ่มต้น</option>
            <option value="price:desc">ราคา มาก → น้อย</option>
            <option value="price:asc">ราคา น้อย → มาก</option>
            <option value="nextPayment:asc">วันชำระ ใกล้สุดก่อน</option>
            <option value="name:asc">ชื่อ ก-ฮ / A-Z</option>
          </select>
        </label>
      </div>
      <div id="filters">
        <label>รอบชำระ
          <select id="f-billing"><option value="">ทั้งหมด</option><option value="monthly">รายเดือน</option><option value="yearly">รายปี</option></select>
        </label>
        <label>หมวด
          <select id="f-category"><option value="">ทั้งหมด</option><option value="entertainment">บันเทิง</option><option value="music">เพลง</option><option value="cloud">คลาวด์</option><option value="education">การเรียน</option><option value="other">อื่น ๆ</option></select>
        </label>
        <label>สถานะ
          <select id="f-active"><option value="">ทั้งหมด</option><option value="true">ใช้งานอยู่</option><option value="false">ยกเลิกแล้ว</option></select>
        </label>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
